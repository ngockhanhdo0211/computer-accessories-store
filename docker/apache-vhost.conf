ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    LimitRequestBody 50331648

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^[A-Za-z0-9.-]+$
    RewriteRule ^ - [R=400,L]

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
