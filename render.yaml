services:
  - type: web
    name: computer-accessories-store
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_CONNECT_TIMEOUT
        value: "2"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        sync: false
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: "true"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: PRODUCT_IMAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: computer-accessories-store/production
      - key: VNPAY_PAYMENT_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNPAY_TERMINAL_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_RETURN_URL
        sync: false
      - key: VNPAY_VERSION
        value: 2.1.0
      - key: VNPAY_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: VNPAY_REFUND_URL
        value: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
      - key: VNPAY_REFUND_CREATE_BY
        sync: false
      - key: VNPAY_REFUND_IP_ADDRESS
        sync: false
      - key: VNPAY_REFUND_CONNECT_TIMEOUT
        value: "5"
      - key: VNPAY_REFUND_TIMEOUT
        value: "15"
      - key: VNPAY_REFUND_SUBMISSION_STALE_SECONDS
        value: "120"
      - key: RUN_MIGRATIONS
        value: "false"
